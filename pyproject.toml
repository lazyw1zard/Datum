[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datum"
version = "0.1.0"
description = "Parametric 3D parts for agents and people: OpenSCAD source -> versions with STL, previews, sections and a self-contained 3D view"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "trimesh>=4.4",
]

[project.optional-dependencies]
step = ["gmsh>=4.14"]

[project.scripts]
datum = "datum.cli:main"
datum-mcp = "datum.mcp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
datum = ["vendor/*"]
